<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hash Collisions Demo</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container">
      <h1>HashMap: Hash Collisions Demo</h1>
      <p class="intro">
        Hash function:
        <code>hash = hash * 31 + charCode(char), bucket = abs(hash) % 5</code>
      </p>

      <section class="controls">
        <label for="keyInput">Key:</label>
        <input id="keyInput" type="text" placeholder="Enter key (e.g. anna)" />
        <button id="addBtn">Add key</button>
        <button id="findBtn">Find key</button>
      </section>

      <section class="examples">
        <span>Quick examples:</span>
        <button class="example-btn" data-key="anna">Add "anna"</button>
        <button class="example-btn" data-key="ivan">Add "ivan"</button>
        <button class="example-btn" data-key="petro">Add "petro"</button>
        <button class="example-btn" data-key="max">Add "max"</button>
      </section>

      <section class="explain" id="explainBox">
        Enter a key and click "Add key" or "Find key".
      </section>

      <section>
        <h2>Buckets</h2>
        <div id="buckets" class="buckets"></div>
      </section>

      <section>
        <h2>Steps Log</h2>
        <ol id="stepsLog" class="steps-log"></ol>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
