<!doctype html>
<html lang="uk">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Popover Burger Menu</title>
  <link rel="stylesheet" href="./style.css" />
</head>

<body>
  <header class="site-header">
    <a class="logo" href="#">CSS Learn</a>

    <nav class="desktop-nav" aria-label="Main navigation">
      <a href="#">Home</a>
      <a href="#">Lessons</a>
      <a href="#">Practice</a>
      <a href="#">Notes</a>
    </nav>

    <button class="burger-button" popovertarget="mobile-nav" aria-label="Open menu">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </header>

  <nav popover id="mobile-nav" class="mobile-nav" aria-label="Mobile navigation">
    <a href="#">Home</a>
    <a href="#">Lessons</a>
    <a href="#">Practice</a>
    <a href="#">Notes</a>
  </nav>

  <main class="page">
    <h1>Native popover burger menu</h1>
    <p>
      This adaptive menu uses HTML and CSS only. Resize the browser to see the
      mobile burger button.
    </p>
  </main>
</body>

</html>
