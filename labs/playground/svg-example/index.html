<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SVG line chart</title>
  </head>
  <body>
    <main>
      <h1>Лінійний SVG-графік</h1>
      <p>Дані беруться зі звичайного масиву в TypeScript.</p>

      <svg
        id="chart"
        viewBox="0 0 700 400"
        role="img"
        aria-labelledby="chart-title chart-description"
      >
        <title id="chart-title">Навчальний лінійний графік</title>
        <desc id="chart-description">Значення масиву, з’єднані лінією.</desc>

        <defs>
          <linearGradient id="line-gradient" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#7c3aed" />
            <stop offset="100%" stop-color="#06b6d4" />
          </linearGradient>

          <filter id="point-shadow" x="-100%" y="-100%" width="300%" height="300%">
            <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.25" />
          </filter>
        </defs>

        <!-- Осі графіка -->
        <line class="axis" x1="70" y1="30" x2="70" y2="330" />
        <line class="axis" x1="70" y1="330" x2="660" y2="330" />

        <!-- Допоміжні горизонтальні лінії -->
        <g class="grid">
          <line class="grid-line" x1="70" y1="30" x2="660" y2="30" />
          <line class="grid-line" x1="70" y1="130" x2="660" y2="130" />
          <line class="grid-line" x1="70" y1="230" x2="660" y2="230" />
        </g>

        <!-- TypeScript додасть сюди лінію та точки -->
        <polyline id="chart-line"></polyline>
        <g id="points"></g>
      </svg>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
